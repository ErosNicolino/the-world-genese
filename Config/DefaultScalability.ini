; Ajustes de desempenho do Vortex por nível de qualidade (Docs/03_Mundo/DESEMPENHO_FPS.md).
; Só o que mudou em relação ao padrão da Unreal (Engine/Config/BaseScalability.ini).

; Épica: o histórico do TSR em 200% (4K numa tela 1080p) custava ~1,3 ms de GPU para quase nenhuma
; diferença no estilo de blocos; em 100% fica igual ao Alto.
[AntiAliasingQuality@3]
r.TSR.History.ScreenPercentage=100

; Épica: sombras do sol com metade do detalhe extra do padrão (-1,5 -> -0,5); ainda mais nítidas que
; no Alto (0) e com menos páginas de sombra virtual para desenhar.
[ShadowQuality@3]
r.Shadow.Virtual.ResolutionLodBiasDirectional=-0.5
r.Shadow.Virtual.ResolutionLodBiasDirectionalMoving=-0.5
